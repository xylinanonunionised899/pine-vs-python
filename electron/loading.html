<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading — Trading Strategy Comparator</title>
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Tokens (matching the app palette exactly) ── */
    :root {
      --bg:          #0b1220;
      --surface:     #0d1829;
      --border:      rgba(150, 180, 220, 0.12);
      --text:        #d7e1f3;
      --muted:       #6b7fa3;
      --pine-gold:   #f4b942;
      --python-blue: #58a6ff;
      --green:       #20c997;
      --red:         #ff6b6b;
      --glow-green:  rgba(32, 201, 151, 0.3);
      --glow-gold:   rgba(244, 185, 66, 0.25);
    }

    /* ── Base ── */
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Fira Sans', 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      user-select: none;
    }

    /* ── Ambient grid background ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(150, 180, 220, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(150, 180, 220, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    /* ── Subtle radial glow behind card ── */
    body::after {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 560px;
      height: 360px;
      background: radial-gradient(ellipse, rgba(32, 201, 151, 0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Layout ── */
    .stage {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 0;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 56px 40px;
      width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      box-shadow: 0 0 0 1px rgba(150, 180, 220, 0.06), 0 24px 64px rgba(0, 0, 0, 0.5);
    }

    /* ── Candlestick icon ── */
    .icon-wrap {
      position: relative;
      width: 56px;
      height: 56px;
    }
    .icon-wrap svg { width: 56px; height: 56px; }

    /* Rotating ring behind icon */
    .icon-ring {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--green);
      border-right-color: rgba(32, 201, 151, 0.3);
      animation: ring-spin 1.4s linear infinite;
    }
    @keyframes ring-spin { to { transform: rotate(360deg); } }

    /* ── Title block ── */
    .title-block { text-align: center; }
    .app-name {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--text);
      line-height: 1.3;
    }
    .app-sub {
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── Progress bar ── */
    .progress-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .progress-track {
      width: 100%;
      height: 3px;
      background: rgba(150, 180, 220, 0.1);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 30%;
      background: linear-gradient(90deg, var(--green), var(--pine-gold));
      border-radius: 99px;
      animation: progress-slide 2s ease-in-out infinite;
      box-shadow: 0 0 8px var(--glow-green);
    }
    @keyframes progress-slide {
      0%   { transform: translateX(-100%); width: 40%; }
      50%  { transform: translateX(120%);  width: 60%; }
      100% { transform: translateX(300%);  width: 30%; }
    }

    /* ── Status dots + text ── */
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: dot-pulse 1.4s ease-in-out infinite;
      flex-shrink: 0;
      box-shadow: 0 0 6px var(--glow-green);
    }
    @keyframes dot-pulse {
      0%, 100% { opacity: 1;   transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }
    #status-text {
      color: var(--muted);
      transition: opacity 0.3s ease;
    }

    /* ── Pill badges ── */
    .badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .badge {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 3px 10px;
      border-radius: 99px;
      border: 1px solid;
    }
    .badge-pine {
      color: var(--pine-gold);
      border-color: rgba(244, 185, 66, 0.3);
      background: rgba(244, 185, 66, 0.06);
    }
    .badge-python {
      color: var(--python-blue);
      border-color: rgba(88, 166, 255, 0.3);
      background: rgba(88, 166, 255, 0.06);
    }
    .badge-local {
      color: var(--green);
      border-color: rgba(32, 201, 151, 0.3);
      background: rgba(32, 201, 151, 0.06);
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      .icon-ring, .progress-fill, .status-dot { animation: none; }
      .progress-fill { width: 60%; transform: none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="card">

      <!-- Candlestick icon with spinning ring -->
      <div class="icon-wrap">
        <div class="icon-ring"></div>
        <!-- Inline SVG candlestick chart icon (no external dep) -->
        <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- Wick lines -->
          <line x1="13" y1="8"  x2="13" y2="14" stroke="#f4b942" stroke-width="2" stroke-linecap="round"/>
          <line x1="13" y1="30" x2="13" y2="36" stroke="#f4b942" stroke-width="2" stroke-linecap="round"/>
          <line x1="28" y1="6"  x2="28" y2="14" stroke="#20c997" stroke-width="2" stroke-linecap="round"/>
          <line x1="28" y1="30" x2="28" y2="38" stroke="#20c997" stroke-width="2" stroke-linecap="round"/>
          <line x1="43" y1="16" x2="43" y2="22" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round"/>
          <line x1="43" y1="36" x2="43" y2="42" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round"/>
          <!-- Candle bodies -->
          <rect x="9"  y="14" width="8" height="16" rx="1.5" fill="#f4b942" opacity="0.9"/>
          <rect x="24" y="14" width="8" height="16" rx="1.5" fill="#20c997" opacity="0.9"/>
          <rect x="39" y="22" width="8" height="14" rx="1.5" fill="#ff6b6b" opacity="0.9"/>
          <!-- Baseline -->
          <line x1="6" y1="48" x2="50" y2="48" stroke="rgba(150,180,220,0.2)" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>

      <!-- App name -->
      <div class="title-block">
        <div class="app-name">Trading Strategy Comparator</div>
        <div class="app-sub">Pine Script &amp; Python Parity Lab</div>
      </div>

      <!-- Animated progress bar -->
      <div class="progress-wrap">
        <div class="progress-track">
          <div class="progress-fill"></div>
        </div>
        <div class="status-row">
          <div class="status-dot"></div>
          <span id="status-text">Starting backend service…</span>
        </div>
      </div>

      <!-- Feature badges -->
      <div class="badges">
        <span class="badge badge-pine">Pine Script</span>
        <span class="badge badge-python">Python</span>
        <span class="badge badge-local">Local-first</span>
      </div>

    </div>
  </div>

  <script>
    // Cycle through status messages while waiting
    const messages = [
      "Starting backend service…",
      "Loading Python engine…",
      "Initialising data store…",
      "Warming up FastAPI…",
      "Almost ready…",
    ];
    let idx = 0;
    const el = document.getElementById("status-text");

    function rotate() {
      el.style.opacity = "0";
      setTimeout(() => {
        idx = (idx + 1) % messages.length;
        el.textContent = messages[idx];
        el.style.opacity = "1";
      }, 300);
    }

    const timer = setInterval(rotate, 2200);

    // If electronAPI is available, poll for backend ready
    if (window.electronAPI) {
      const poll = setInterval(async () => {
        try {
          const { ready } = await window.electronAPI.getBackendStatus();
          if (ready) clearInterval(poll);
        } catch (_) {}
      }, 800);
    }

    // Clean up on unload (when main.js navigates to the real app)
    window.addEventListener("beforeunload", () => clearInterval(timer));
  </script>
</body>
</html>
