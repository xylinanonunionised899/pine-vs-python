[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-strategy-comparator-backend"
version = "0.1.0"
description = "FastAPI backend for Pine/Python strategy comparison"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "python-multipart>=0.0.20",
  "orjson>=3.11.0",
  "httpx>=0.28.0",
  "pandas>=2.2.0",
  "numpy>=2.3.0",
  "openpyxl>=3.1.5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
  "mypy>=1.17.0"
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = false
